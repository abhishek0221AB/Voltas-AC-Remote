<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Voltas AC Remote</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="remote-card" aria-label="Voltas AC Remote">
      <header class="topbar">
        <div>
          <p class="eyebrow">SMART IR REMOTE</p>
          <h1>VOLTAS</h1>
        </div>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☾</button>
      </header>

      <section class="display" aria-live="polite">
        <div class="display-row">
          <span id="powerStatus" class="status-pill off">OFF</span>
          <span id="modeStatus">COOL</span>
        </div>
        <div class="temperature-wrap">
          <span id="temperature">24</span><span class="degree">°C</span>
        </div>
        <div class="status-grid">
          <span>Fan: <strong id="fanStatus">AUTO</strong></span>
          <span>V-Swing: <strong id="vSwingStatus">OFF</strong></span>
          <span>Lamp: <strong id="lampStatus">ON</strong></span>
          <span>Turbo: <strong id="turboStatus">OFF</strong></span>
        </div>
      </section>

      <button id="powerBtn" class="power-btn">⏻ POWER</button>

      <section class="temp-controls">
        <button data-action="temp-down" class="round-btn" aria-label="Decrease temperature">−</button>
        <div class="temp-label">Temperature</div>
        <button data-action="temp-up" class="round-btn" aria-label="Increase temperature">+</button>
      </section>

      <section class="button-grid">
        <button data-action="mode">MODE</button>
        <button data-action="fan">FAN</button>
        <button data-action="v-swing">V-SWING</button>
        <button data-action="lamp">LAMP</button>
        <button data-action="turbo" class="wide-button">TURBO</button>
      </section>

      <section class="timer-card">
        <h2>Timer ON</h2>
        <div class="timer-row">
          <select id="timerOnHours" aria-label="Timer ON hours"></select>
          <button id="setTimerOnBtn">SET ON</button>
        </div>
        <button id="cancelTimerOnBtn" class="cancel-button">CANCEL TIMER ON</button>
      </section>

      <section class="timer-card">
        <h2>Timer OFF</h2>
        <div class="timer-row">
          <select id="timerOffHours" aria-label="Timer OFF hours"></select>
          <button id="setTimerOffBtn">SET OFF</button>
        </div>
        <button id="cancelTimerOffBtn" class="cancel-button">CANCEL TIMER OFF</button>
      </section>

      <section class="timer-summary">
        <span>ON: <strong id="timerOnStatus">OFF</strong></span>
        <span>OFF: <strong id="timerOffStatus">OFF</strong></span>
      </section>

      <p id="bridgeStatus" class="bridge-status">Checking Android IR bridge…</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
