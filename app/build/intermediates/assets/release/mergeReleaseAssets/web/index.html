<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Voltas AC Remote</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="remote-card" aria-label="Voltas AC Remote">
      <header class="topbar">
        <div>
          <p class="eyebrow">SMART IR REMOTE</p>
          <h1>VOLTAS</h1>
        </div>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☾</button>
      </header>

      <section class="display" aria-live="polite">
        <div class="display-row">
          <span id="powerStatus" class="status-pill off">OFF</span>
          <span id="modeStatus">COOL</span>
        </div>

        <div class="temperature-wrap">
          <span id="temperature">24</span><span class="degree">°C</span>
        </div>

        <div class="status-grid">
          <span>Fan: <strong id="fanStatus">AUTO</strong></span>
          <span>V-Swing: <strong id="vSwingStatus">OFF</strong></span>
          <span>Lamp: <strong id="lampStatus">ON</strong></span>
          <span>Turbo: <strong id="turboStatus">OFF</strong></span>
        </div>
      </section>

      <button id="powerBtn" class="power-btn power-off" aria-label="Toggle AC power">
        <svg class="power-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v9" />
          <path d="M6.4 5.6a8 8 0 1 0 11.2 0" />
        </svg>
        <span>POWER</span>
      </button>

      <section class="temp-controls">
        <button data-action="temp-down" class="round-btn ac-control" aria-label="Decrease temperature">−</button>
        <div class="temp-label">Temperature</div>
        <button data-action="temp-up" class="round-btn ac-control" aria-label="Increase temperature">+</button>
      </section>

      <section class="button-grid">
        <button data-action="mode" class="ac-control">MODE</button>
        <button data-action="fan" class="ac-control">FAN</button>
        <button data-action="v-swing" class="ac-control">V-SWING</button>
        <button data-action="lamp" class="ac-control">LAMP</button>
        <button data-action="turbo" class="wide-button ac-control">TURBO</button>
      </section>

      <section class="timer-grid">
        <section class="timer-card" id="timerOffCard">
          <h2>Timer OFF</h2>
          <select id="timerOffHours" aria-label="Timer OFF hours"></select>
          <button id="setTimerOffBtn">SET OFF</button>
          <button id="cancelTimerOffBtn" class="cancel-button">CANCEL OFF</button>
        </section>

        <section class="timer-card" id="timerOnCard">
          <h2>Timer ON</h2>
          <select id="timerOnHours" aria-label="Timer ON hours"></select>
          <button id="setTimerOnBtn">SET ON</button>
          <button id="cancelTimerOnBtn" class="cancel-button">CANCEL ON</button>
        </section>
      </section>

      <section class="timer-summary">
        <span>OFF: <strong id="timerOffStatus">OFF</strong></span>
        <span>ON: <strong id="timerOnStatus">OFF</strong></span>
      </section>

      <p id="bridgeStatus" class="bridge-status">Checking Android IR bridge…</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
